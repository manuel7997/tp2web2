spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com

# --- TP2: PostgreSQL (los valores por defecto coinciden con docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tp2}
spring.datasource.username=${DB_USER:tp2}
spring.datasource.password=${DB_PASSWORD:tp2}

# El esquema lo maneja Flyway; Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway aplica db/migration al arrancar
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- TP3: JWT ---
# En produccion JWT_SECRET se define como variable de entorno (minimo 32 caracteres para HS256).
# El valor por defecto es solo para desarrollo local: nunca se usa en el despliegue.
app.jwt.secret=${JWT_SECRET:dev-only-secret-cambiar-en-produccion-32chars-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- TP3: despliegue ---
# Render (y otros proveedores) indican el puerto por la variable PORT; en local sigue siendo 8080.
server.port=${PORT:8080}